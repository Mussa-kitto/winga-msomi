<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>WM link tests</title>
  <!-- Dev-only test page (excluded from deploys by .vercelignore).
       Open http://localhost:5501/tests/whatsapp-test.html with a local server. -->
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; color: #0f172a; background: #f8fafc; }
    h1 { font-size: 20px; }
    .sum { padding: 10px 14px; border-radius: 8px; font-weight: 700; margin-bottom: 16px; }
    .ok { background: #dcfce7; color: #166534; } .bad { background: #fee2e2; color: #991b1b; }
    li { margin: 4px 0; } li.fail { color: #b91c1c; font-weight: 700; }
    pre { white-space: pre-wrap; background: #fff; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Winga Msomi — WhatsApp link &amp; message tests</h1>
  <div id="sum" class="sum"></div>
  <ol id="out"></ol>
  <h2>Sample messages</h2>
  <pre id="samples"></pre>

  <script src="../js/data/site.js"></script>
  <script src="../js/data/sellers.js"></script>
  <script src="../js/data/categories.js"></script>
  <script src="../js/data/products.js"></script>
  <script src="../js/whatsapp.js"></script>
  <script src="../js/render.js"></script>
  <script>
    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    function check(name, cond, detail) {
      const li = document.createElement('li');
      li.textContent = `${cond ? 'PASS' : 'FAIL'} — ${name}${!cond && detail ? ` (${detail})` : ''}`;
      if (!cond) li.className = 'fail';
      out.appendChild(li);
      cond ? pass++ : fail++;
    }
    const num = url => (url.match(/wa\.me\/(\d+)/) || [])[1];
    const text = url => decodeURIComponent((url.split('?text=')[1] || ''));
    const P = id => WM.catalog.product(id);
    const SINGLE = '255687602205';

    /* 1. Every product: quick order + chat go to the forced number with the right text */
    WM.products.forEach(p => {
      const o = WM.wa.productOrderLink(p);
      const c = WM.wa.productChatLink(p);
      check(`order link ${p.id}`, num(o) === SINGLE && text(o).includes(p.name) &&
        text(o).includes(`TZS ${p.price.toLocaleString('en-US')}`) && text(o).includes(`product.html?id=${p.id}`), text(o));
      check(`chat link ${p.id}`, num(c) === SINGLE && text(c).startsWith('Habari! Naomba maelezo zaidi kuhusu ' + p.name), text(c));
    });

    /* 2. Quantity order */
    const q = text(WM.wa.productOrderLink(P('gaming-mouse'), 3));
    check('qty order text', q.startsWith('Nataka Gaming Mouse x3 - TZS 135,000 (TZS 45,000 kila moja)'), q);

    /* 3. Cart message (combined) */
    const lines = [{ product: P('wired-earphones'), qty: 2, subtotal: 14000 }, { product: P('phone-covers'), qty: 1, subtotal: 12000 }];
    const orders = WM.wa.cartOrders(lines);
    const t = text(orders[0].url);
    check('cart: one combined order while forced', orders.length === 1 && num(orders[0].url) === SINGLE);
    check('cart: greeting', t.startsWith('Habari! Nataka kuagiza:'));
    check('cart: numbered items with qty + unit price', t.includes('1) Wired Earphones x2 — TZS 14,000 (TZS 7,000 kila moja)') && t.includes('2) Phone Covers x1 — TZS 12,000'));
    check('cart: order note kept', t.includes('(taja model ya simu yako)'));
    check('cart: total', t.includes('Jumla: TZS 26,000'));
    check('cart: buyer name + hostel line', t.includes('Jina langu:') && t.includes('Hostel/Mahali nilipo:'));
    check('cart: product links', t.includes('product.html?id=wired-earphones'));
    check('cart: link encoded (no raw spaces/newlines)', !/[\s]/.test(orders[0].url));

    /* 4. Per-seller split when the switch is off (test seller only in memory) */
    WM.sellers.push({ id: 'test-seller', name: 'Test Seller', whatsapp: '255700000000', active: true });
    const two = [lines[0], { product: { ...P('flash-disk'), sellerId: 'test-seller' }, qty: 1, subtotal: P('flash-disk').price }];
    check('forced: two sellers -> one message', WM.wa.cartOrders(two).length === 1);
    const saved = WM.site.forceWhatsappNumber;
    WM.site.forceWhatsappNumber = '';
    const split = WM.wa.cartOrders(two);
    check('not forced: one message per seller', split.length === 2 && num(split[0].url) === SINGLE && num(split[1].url) === '255700000000');
    check('not forced: product chat uses seller number', num(WM.wa.productChatLink({ ...P('earbud'), sellerId: 'test-seller' })) === '255700000000');
    WM.site.forceWhatsappNumber = saved;
    WM.sellers.pop();

    /* 5. Long orders: links dropped first, then flagged */
    const all = WM.catalog.visible().map(p => ({ product: p, qty: 1, subtotal: p.price }));
    const twelve = WM.wa.cartOrders(all.slice(0, 12))[0];
    check('12 items fit (links dropped)', !twelve.tooLong && twelve.url.length <= 2000, twelve.url.length);
    check('52 items flagged as too long', WM.wa.cartOrders(all)[0].tooLong);

    /* 6. Contact links */
    check('general contact', num(WM.wa.contactLink()) === SINGLE && text(WM.wa.contactLink()).includes('WINGA MSOMI'));
    check('request link with query', text(WM.wa.requestLink('heater')).includes('Bidhaa ninayotafuta ni: heater.'));
    check('sell message', text(WM.wa.contactLink(WM.site.messages.sell)).includes('Nataka kuuza bidhaa'));

    /* 7. Phone numbers only in site.js / sellers.js */
    const numbers = new Set([WM.site.forceWhatsappNumber, WM.site.contactWhatsapp, ...WM.sellers.map(s => s.whatsapp)]);
    check('only the confirmed number is used', numbers.size === 1 && numbers.has(SINGLE), [...numbers].join(','));

    document.getElementById('sum').textContent = `${pass} passed, ${fail} failed`;
    document.getElementById('sum').className = `sum ${fail ? 'bad' : 'ok'}`;
    document.getElementById('samples').textContent = [
      text(WM.wa.productOrderLink(P('wired-earphones'))), '---',
      text(WM.wa.productChatLink(P('wired-earphones'))), '---', t
    ].join('\n');
    window.__results = { pass, fail };
  </script>
</body>
</html>
